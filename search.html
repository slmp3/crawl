<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SLMP3 Crawl - Search</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
</head>
<body>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
  :root {
    --bg-color: rgb(255,255,255);
    --text-color: rgb(0,0,0);
  }

  [data-theme="dark"] {
    --bg-color: rgb(0,0,0);
    --text-color: rgb(255,255,255);
  }

  body {
    background-color: var(--bg-color);
    color: var(--text-color);
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 2rem;
    transition: background-color 0.3s, color 0.3s;
  }

  h1 {
    text-align: center;
  }

  #search-box {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 0.5rem;
    margin: 2rem 0;
  }

  #query {
    width: 50%;
    padding: 0.5rem;
    font-size: 1rem;
  }

  #search-btn {
    padding: 0.5rem 1rem;
    font-size: 1rem;
    cursor: pointer;
  }

  #results {
    max-width: 800px;
    margin: 0 auto;
    line-height: 1.6;
  }

  a {
    color: #1a0dab;
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
  }

  #theme-toggle {
    position: fixed;
    top: 0rem;
    right: 0rem;
    padding: 0.5rem 1rem;
    cursor: pointer;
  }

  .result {
    word-wrap: break-word;
    overflow-wrap: break-word;
    white-space: normal;
    max-width: 800px;
    margin-bottom: 1rem;
  }
</style>
<body data-theme="light">
<button id="theme-toggle">Toggle Dark/Light</button>
<h1>SLMP3 Crawl</h1>
<div id="search-box">
  <input type="text" id="query" placeholder="Search...">
  <button id="search-btn">Search</button>
</div>

<div id="results"></div>

<script>
const stopwords = new Set([
  "a","o","os","as","de","da","do","das","dos","e","é","em","para","por","com",
  "que","um","uma","uns","umas","no","na","nos","nas","ao","à","aos","às",
  "the","is","in","on","of","to","for","and","with","at","by",
  "el","la","los","las","un","una","unos","unas","y","en","para","por","con",
  "le","la","les","un","une","des","et","en","pour","avec","dans","de"
]);

const resultsDiv = document.getElementById('results');
const queryInput = document.getElementById('query');
const searchBtn = document.getElementById('search-btn');

let pages = [];

async function loadPages() {
  try {
    const response = await fetch('./index.json');
    pages = await response.json();

    const params = new URLSearchParams(window.location.search);
    const q = params.get('i');
    if (q) {
      queryInput.value = q;
      doSearch(q);
    }

  } catch (err) {
    resultsDiv.innerHTML = `<p>Error loading search data: ${err}</p>`;
  }
}

loadPages();

searchBtn.addEventListener('click', () => {
  const q = queryInput.value.trim();
  if (!q) return;
  window.location.href = `search.html?i=${encodeURIComponent(q)}`;
});

function doSearch(q) {
  const words = q.toLowerCase()
                 .split(/\s+/)
                 .filter(w => w && !stopwords.has(w));

  if (words.length === 0) {
    resultsDiv.innerHTML = `<strong>your input only has stopwords!</strong>`;
    return;
  }
  
  if (!q) {
  
  }

  const results = pages.filter(p => {
    const title = p.title.toLowerCase();
    const text = p.text.toLowerCase();
    return words.some(w => title.includes(w) || text.includes(w));
  });

  resultsDiv.innerHTML = results.length
    ? results.map(p => `
      <div class="result">
        <a href="${p.url}"><strong>${p.title}</strong></a><br>
        <span>${p.text}</span>
      </div>
    `).join('<br>')
    : `<p>No results found for "<strong>${q}</strong>".</p>`;
}

const toggleButton = document.getElementById('theme-toggle');
const body = document.body;

const savedTheme = localStorage.getItem('theme');
if (savedTheme) {
  body.dataset.theme = savedTheme;
} else {
  body.dataset.theme = 'light';
}

toggleButton.addEventListener('click', () => {
  const newTheme = body.dataset.theme === 'light' ? 'dark' : 'light';
  body.dataset.theme = newTheme;
  localStorage.setItem('theme', newTheme);
});
</script>
</body>
</html>
